<title>Jelajah Mangrove Digital</title>
<link rel="manifest" href="./manifest.webmanifest">
<meta name="theme-color" content="#2d7a43">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="icon" href="./icon-192.png">
<link rel="apple-touch-icon" href="./icon-192.png">

<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Baloo+2:wght@600;800&family=Lexend:wght@400;600&display=swap">
<style>
/* Konsep: panel kertas di atas latar sungai bakau; peta berupa sungai berkelok dengan lima pos level berwarna. */
:root{
  --ink:#14301f; --ink-soft:#3d5a48; --paper:#f8fcf5; --mint:#e4f3e1; --line:#b9d6b5;
  --leaf:#2d7a43; --leaf-dk:#1c5a30; --water:#2aa1a6; --water-dk:#136b73; --sky:#d4efee;
  --wood:#8a5726; --wood-dk:#5a3513; --wood-lt:#cf9a55; --gold:#ffd666;
  --sun:#f28c1b; --sun-dk:#b85f05; --on-sun:#2a1500;
  --ok:#1b7f45; --ok-bg:#dcf2e2; --bad:#b83a2c; --bad-bg:#fbe3df; --warn-bg:#fff2cf;
  --focus:#0b3d91; --nd:clamp(46px,7vw,68px);
  --f-display:'Baloo 2','Trebuchet MS',system-ui,sans-serif;
  --f-body:'Atkinson Hyperlegible',system-ui,-apple-system,'Segoe UI',sans-serif;
  color-scheme:light;
}
html.hc{--ink:#000;--ink-soft:#000;--paper:#fff;--mint:#fff;--line:#000;--leaf:#00531f;--leaf-dk:#003a15;--sky:#fff;--sun:#ffd400;--sun-dk:#000;--on-sun:#000;--wood:#000;--wood-dk:#000;--wood-lt:#000;--ok:#005a26;--ok-bg:#fff;--bad:#a00000;--bad-bg:#fff;--warn-bg:#fff;--focus:#0000ee;--water:#00535a;--water-dk:#000}
html{font-size:16px}
html.big{font-size:20px}
body{margin:0;position:relative;color:var(--ink);font:400 1rem/1.55 var(--f-body);
  background-color:var(--sky);background-image:linear-gradient(#d4efee 0,#bfe6e2 40%,#a6dbd7 100%);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px 48px;min-height:100%}
html.hc body{background-image:none}
html.dys body,html.dys button,html.dys textarea,html.dys input{font-family:'Lexend','Atkinson Hyperlegible',sans-serif;letter-spacing:.04em;word-spacing:.14em;line-height:1.85}
.band{position:absolute;left:0;right:0;top:0;height:190px;overflow:hidden;z-index:0;pointer-events:none}
.band svg{width:100%;height:100%;display:block}
html.hc .band{display:none}
.wrap{position:relative;z-index:1;max-width:1000px;margin-inline:auto}
*{box-sizing:border-box}
h1,h2,h3,p{margin:0}
button,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--focus);outline-offset:3px;border-radius:8px}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* kepala halaman */
.top{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center;justify-content:space-between;margin-bottom:14px}
.sign{background:linear-gradient(var(--wood-lt),var(--wood));border:3px solid var(--wood-dk);border-radius:14px;color:var(--gold);
  font:800 clamp(1.15rem,3.6vw,1.6rem)/1.15 var(--f-display);padding:6px 18px 4px;text-shadow:0 2px 0 var(--wood-dk);box-shadow:0 4px 0 rgba(0,0,0,.18);text-wrap:balance}
.sign.sm{font-size:1.25rem;padding:4px 16px 2px}
.tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.pill{background:var(--paper);border:2px solid var(--line);border-radius:999px;padding:4px 14px;font-weight:700;font-size:.95rem;min-height:40px;display:inline-flex;align-items:center;gap:6px}
button.pill{cursor:pointer}
button.pill:hover{border-color:var(--leaf)}

/* tombol */
.btn{font:800 1.05rem/1.2 var(--f-display);min-height:48px;padding:8px 22px;border-radius:14px;border:0;border-bottom:4px solid var(--sun-dk);background:var(--sun);color:var(--on-sun);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-align:center}
.btn:hover:not(:disabled){filter:brightness(1.06)}
.btn:active:not(:disabled){transform:translateY(2px);border-bottom-width:2px}
.btn.green{background:var(--leaf);border-bottom-color:var(--leaf-dk);color:#fff}
.btn.red{background:var(--bad);border-bottom-color:#7c2217;color:#fff}
.btn.ghost{background:var(--paper);color:var(--leaf-dk);border:2px solid var(--leaf);border-bottom-width:4px}
.btn.big{font-size:1.35rem;min-height:58px;padding:10px 34px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.row.end{justify-content:flex-end}

/* panel */
.panel{background:var(--paper);border:3px solid var(--line);border-radius:24px;padding:clamp(14px,3vw,26px);box-shadow:0 8px 0 rgba(20,48,31,.10);display:flex;flex-direction:column;gap:16px}
.lvl-head{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center}
.chip{background:var(--leaf-dk);color:#fff;border-radius:999px;padding:4px 16px 2px;font:800 1rem var(--f-display)}
.lvl-title{font:800 clamp(1.25rem,3.4vw,1.7rem)/1.15 var(--f-display);color:var(--leaf-dk);text-wrap:balance}
.instr{background:var(--warn-bg);border:2px solid var(--wood-lt);border-radius:14px;padding:10px 16px;font-weight:700}
.prog{color:var(--ink-soft)}
.note{font-size:.92rem;color:var(--ink-soft)}
.hint{min-height:1.5em;color:var(--ink-soft);font-size:.95rem}

/* pembuka */
.hero{display:grid;grid-template-columns:1.05fr 1fr;gap:22px;align-items:stretch}
.hero-left{display:flex;flex-direction:column;gap:16px;justify-content:center;min-width:0}
.kicker{font-weight:700;color:var(--water-dk);font-size:.95rem}
.title-sign{background:linear-gradient(var(--wood-lt),var(--wood));border:4px solid var(--wood-dk);border-radius:20px;padding:14px 20px 10px;box-shadow:0 6px 0 rgba(0,0,0,.2)}
.title-sign h1{font:800 clamp(2rem,6.4vw,3.4rem)/.95 var(--f-display);color:var(--gold);text-shadow:0 3px 0 var(--wood-dk),0 0 2px var(--wood-dk);text-wrap:balance}
.title-sign p{color:#fff;font-weight:700;margin-top:6px;text-shadow:0 1px 0 var(--wood-dk)}
.menu{display:flex;flex-wrap:wrap;gap:10px}
.hero-art{position:relative;border-radius:20px;overflow:hidden;border:3px solid var(--line);min-height:260px;background:#cfeaf0}
.hero-art svg.scene{position:absolute;inset:0;width:100%;height:100%}
.hero-art .mascot{position:absolute;left:4%;bottom:0;width:34%;max-width:150px}
.foot{font-weight:700;color:var(--ink-soft)}

/* panduan */
.two{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.card{background:var(--mint);border:2px solid var(--line);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.card h2{font:800 1.2rem var(--f-display);color:var(--leaf-dk)}
.guide li{display:flex;gap:12px;align-items:flex-start}
.guide ul,.steps,.plain{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:12px}
.ico{flex:none;width:36px;height:36px;color:var(--leaf-dk)}
.sw{display:flex;gap:12px;align-items:center;justify-content:space-between;background:var(--paper);border:2px solid var(--line);border-radius:14px;padding:8px 12px;cursor:pointer}
.sw small{display:block;color:var(--ink-soft);font-size:.82rem;line-height:1.3}
.sw input{appearance:none;-webkit-appearance:none;flex:none;width:52px;height:30px;border-radius:99px;background:#7d8a82;position:relative;margin:0;cursor:pointer}
.sw input::after{content:'';position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:transform .15s}
.sw input:checked{background:var(--leaf)}
.sw input:checked::after{transform:translateX(22px)}
.sw input:disabled{opacity:.5;cursor:not-allowed}

/* peta */
.map{position:relative;border-radius:22px;overflow:hidden;border:3px solid var(--wood-lt);background:#9ed59a;aspect-ratio:1000/562}
.map>svg{position:absolute;inset:0;width:100%;height:100%;display:block}
.node{position:absolute;transform:translate(-50%,-50%);width:var(--nd);height:var(--nd);border-radius:50%;border:4px solid #fff;background:var(--c);color:#fff;font:800 clamp(1.2rem,3vw,1.7rem) var(--f-display);cursor:pointer;box-shadow:0 4px 0 rgba(0,0,0,.28);display:grid;place-items:center;padding:0;line-height:1}
.node:hover:not(:disabled){transform:translate(-50%,-50%) scale(1.07)}
.node.locked{background:#7d8a82;cursor:not-allowed}
.node.current::before{content:'';position:absolute;inset:-10px;border-radius:50%;border:3px solid var(--c);animation:ping 1.8s ease-out infinite}
@keyframes ping{0%{transform:scale(.85);opacity:.9}100%{transform:scale(1.4);opacity:0}}
.node .lbl{position:absolute;top:calc(100% + 8px);left:50%;transform:translateX(-50%);width:max-content;max-width:min(150px,30vw);background:var(--paper);color:var(--ink);border:2px solid var(--c);border-radius:10px;padding:2px 8px;font:700 .8rem/1.25 var(--f-body);text-align:center;box-shadow:0 2px 0 rgba(0,0,0,.15)}
.node .bd{position:absolute;right:-8px;top:-8px;width:26px;height:26px;border-radius:50%;background:var(--ok);border:2px solid #fff;display:grid;place-items:center}
.node .bd svg{width:14px;height:14px}
.node .lk{width:44%;height:44%}

/* Level 1 */
.l1{display:grid;grid-template-columns:1.5fr 1fr;gap:16px;align-items:start}
.imgs{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:12px}
.cardimg{position:relative;background:#dff1f3;border:3px solid var(--line);border-radius:16px;padding:6px 6px 0;cursor:pointer;display:flex;flex-direction:column;align-items:stretch;gap:4px;overflow:hidden;min-width:0}
.cardimg svg{width:100%;height:auto;display:block}
.cardimg .tag{background:var(--paper);border-top:2px solid var(--line);margin:0 -6px;padding:5px 6px;font-weight:700;font-size:.88rem;text-align:center;color:var(--ink-soft)}
.cardimg.paired .tag{color:var(--leaf-dk);background:var(--ok-bg)}
.cardimg.sel{border-color:var(--sun);box-shadow:0 0 0 4px rgba(242,140,27,.35)}
.num{position:absolute;left:6px;top:6px;background:var(--leaf-dk);color:#fff;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font:800 .9rem var(--f-display);z-index:1}
.names{display:flex;flex-direction:column;gap:8px}
.name{background:var(--paper);border:2px solid var(--line);border-radius:12px;min-height:48px;padding:8px 14px;text-align:left;font-weight:700;cursor:pointer;display:flex;justify-content:space-between;gap:8px;align-items:center}
.name:hover{border-color:var(--leaf)}
.name.used{background:var(--ok-bg);border-color:var(--ok)}
.name .num2{font-size:.8rem;background:var(--leaf-dk);color:#fff;border-radius:999px;padding:1px 10px;white-space:nowrap}

/* Level 2 */
.stmt{background:#fff;border:3px solid var(--line);border-radius:18px;padding:clamp(16px,4vw,28px);font:700 clamp(1.15rem,3vw,1.5rem)/1.4 var(--f-body);text-align:center;text-wrap:balance}
html.hc .stmt{background:#fff}
.fo{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.fo .btn{min-height:56px;font-size:1.25rem}
.fo .btn[aria-pressed="true"]{outline:4px solid var(--ink);outline-offset:2px}
.verdict{border-radius:14px;padding:12px 16px;display:flex;gap:12px;align-items:flex-start;border:2px solid}
.verdict.ok{background:var(--ok-bg);border-color:var(--ok)}
.verdict.bad{background:var(--bad-bg);border-color:var(--bad)}
.meter{height:10px;border-radius:99px;background:var(--line);overflow:hidden}
.meter i{display:block;height:100%;background:var(--leaf)}

/* Level 3 */
.l3{display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:start}
.chips,.slots{display:flex;flex-direction:column;gap:10px}
.sent{background:#fff;border:2px solid var(--line);border-radius:12px;padding:10px 14px;text-align:left;cursor:pointer;font-weight:700;min-height:48px}
.sent.sel{border-color:var(--sun);box-shadow:0 0 0 4px rgba(242,140,27,.35)}
.slotrow{display:flex;flex-direction:column;gap:4px}
.stag{align-self:flex-start;background:var(--tc);color:#fff;border-radius:999px;padding:1px 12px;font:800 .9rem var(--f-display)}
.slot{border:3px dashed var(--tc);background:#fff;border-radius:12px;min-height:56px;padding:8px 14px;text-align:left;cursor:pointer;color:var(--ink-soft);font-weight:700}
.slot.filled{border-style:solid;color:var(--ink)}
.empty{color:var(--ink-soft);font-style:normal;padding:8px 2px}
html.dys .empty{font-style:normal}

/* Level 4 */
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.opt{background:#fff;border:3px solid var(--line);border-radius:16px;padding:10px;display:flex;flex-direction:column;gap:8px;align-items:center;text-align:center;cursor:pointer;font-weight:700;min-width:0}
.opt svg{width:84px;height:84px}
.opt[aria-pressed="true"]{border-color:var(--sun);box-shadow:0 0 0 4px rgba(242,140,27,.35)}
.opt.ok{border-color:var(--ok);background:var(--ok-bg);box-shadow:none}
.opt.bad{border-color:var(--bad);background:var(--bad-bg);box-shadow:none}
.opt .why{font-weight:400;font-size:.9rem;color:var(--ink)}
.opt .mk2{font-weight:800}

/* Level 5 */
.l5{display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:start}
.pic{border:3px solid var(--line);border-radius:16px;overflow:hidden;background:#cfeaf0}
.pic svg{display:block;width:100%;height:auto}
.facts{margin:0;padding-left:1.2rem;display:flex;flex-direction:column;gap:4px}
textarea{width:100%;min-height:190px;border:3px solid var(--line);border-radius:14px;padding:12px 14px;background:#fff;color:var(--ink);resize:vertical}
html.hc textarea{border-color:#000}
.cnt{display:flex;justify-content:space-between;gap:8px;font-size:.92rem;color:var(--ink-soft)}

/* umpan balik */
.fbhead{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.fbhead .mascot{width:92px;flex:none}
.big-ic{width:64px;height:64px;border-radius:50%;display:grid;place-items:center;flex:none}
.big-ic.ok{background:var(--ok);color:#fff}
.big-ic.mid{background:var(--sun);color:var(--on-sun)}
.big-ic.low{background:var(--bad);color:#fff}
.big-ic svg{width:36px;height:36px}
.fbtitle{font:800 clamp(1.4rem,4vw,2rem)/1.1 var(--f-display);color:var(--leaf-dk)}
.lesson{display:flex;gap:14px;align-items:center;background:var(--mint);border:2px solid var(--line);border-radius:16px;padding:12px}
.lesson svg{width:110px;flex:none;border-radius:10px;background:#dff1f3}
.items{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.items li{display:flex;gap:10px;align-items:flex-start;border-radius:12px;padding:8px 12px;border:2px solid}
.items li.ok{background:var(--ok-bg);border-color:var(--ok)}
.items li.bad{background:var(--bad-bg);border-color:var(--bad)}
.items .mk{flex:none;width:24px;height:24px;margin-top:2px}
.items p{font-size:.95rem}
.items .mk svg,.verdict .mk svg{width:100%;height:100%;display:block}
.items .mk>span{display:block;width:100%;height:100%}
.verdict .mk{color:inherit}
.verdict.ok .mk{color:var(--ok)}
.verdict.bad .mk{color:var(--bad)}
.tipbox{background:var(--warn-bg);border:2px solid var(--wood-lt);border-radius:14px;padding:10px 16px}

/* hasil */
.res{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.score{font:800 clamp(3.6rem,12vw,5.5rem)/1 var(--f-display);color:var(--leaf-dk);font-variant-numeric:tabular-nums}
.stars{display:flex;gap:6px}
.stars svg{width:44px;height:44px}
.lvbar{display:grid;grid-template-columns:minmax(0,9.5rem) 1fr 3.2rem;gap:8px;align-items:center;font-size:.9rem}
.lvbar b{font-variant-numeric:tabular-nums;text-align:right}
.checks li{display:flex;gap:10px;align-items:flex-start}
.checks svg{flex:none;width:22px;height:22px;color:var(--ok);margin-top:2px}
.quote{background:linear-gradient(var(--wood-lt),var(--wood));color:#fff;border:3px solid var(--wood-dk);border-radius:14px;padding:12px 16px;font:800 1.1rem/1.3 var(--f-display);text-shadow:0 1px 0 var(--wood-dk)}

/* modal */
.modal{position:fixed;inset:0;background:rgba(10,30,18,.6);display:grid;place-items:center;padding:16px;z-index:50;overflow:auto}
.modal-box{background:var(--paper);border:3px solid var(--wood-lt);border-radius:20px;padding:20px;max-width:640px;width:100%;display:flex;flex-direction:column;gap:12px;max-height:calc(100% - 8px);overflow:auto}
.modal-box h2{font:800 1.4rem var(--f-display);color:var(--leaf-dk)}
.modal-box input[type=text]{border:3px solid var(--line);border-radius:12px;padding:10px 14px;min-height:48px;background:#fff;color:var(--ink);width:100%}
.cert{width:100%;height:auto;border:2px solid var(--line);border-radius:8px;display:block}

@media (max-width:760px){
  .hero,.two,.l1,.l3,.l5,.res{grid-template-columns:1fr}
  .hero-art{min-height:230px}
}
@media (max-width:640px){
  .map{aspect-ratio:600/1000}
  .node .lbl{max-width:38vw}
}
@media (prefers-reduced-motion:reduce){
  *{animation:none!important;transition:none!important}
}
</style>

<div class="band" aria-hidden="true" id="band"></div>
<header id="top" class="wrap top" hidden>
  <div class="sign">Jelajah Mangrove Digital</div>
  <div class="tools">
    <span class="pill" id="scoreChip">Skor 0</span>
    <button class="pill" data-act="toMap" id="btnMap" type="button">Peta</button>
    <button class="pill" data-act="speak" id="btnSpeak" type="button" aria-label="Bacakan layar ini">Suara</button>
    <button class="pill" data-act="toGuide" type="button">Pengaturan</button>
  </div>
</header>
<main id="app" class="wrap" tabindex="-1"></main>
<div class="vh" id="live" aria-live="polite"></div>

  {id:'daun',name:'Daun mangrove',desc:'daun hijau tebal pada ranting',fact:'Daun mangrove tebal dan licin; pada beberapa jenis, kelebihan garam dikeluarkan lewat daun.'},
  {id:'bunga',name:'Bunga mangrove',desc:'bunga kuning berkelopak lima',fact:'Bunga mangrove akan berkembang menjadi buah atau propagul yang dapat tumbuh menjadi bibit baru.'},

  {id:'ikan',name:'Ikan',desc:'hewan air berwarna biru dengan sirip dan ekor',fact:'Banyak ikan kecil berlindung dan mencari makan di antara akar mangrove.'}
];
var L1M={};L1.forEach(function(x){L1M[x.id]=x;});

var L2=[
  {s:'Mangrove dapat mencegah abrasi dan menjaga keseimbangan ekosistem pesisir.',t:'fakta',e:'Dapat dibuktikan: akar mangrove menahan tanah dan meredam gelombang sehingga abrasi berkurang.'},

  {s:'Akar tunjang mangrove menancap kuat pada lumpur.',t:'fakta',e:'Hal ini dapat diamati langsung di lapangan.'},

  {s:'Menurut saya, menanam mangrove adalah kegiatan yang membosankan.',t:'opini',e:'"Menurut saya" dan "membosankan" menunjukkan perasaan atau pendapat pribadi.'}
];

var STRUCT=[
  {name:'Pernyataan umum',tc:'#2d7fd1',tip:'Pernyataan umum mengenalkan objek yang diamati.'},
  {name:'Deskripsi bagian',tc:'#c9780a',tip:'Deskripsi bagian menjelaskan ciri bagian-bagian objek.'},
  {name:'Deskripsi manfaat',tc:'#2a8f55',tip:'Deskripsi manfaat menjelaskan kegunaan objek.'},

/* ---------- render & navigasi ---------- */
function updateHeader(){
  var top=document.getElementById('top'),hide=state.screen==='open'||state.screen==='bye';
  top.hidden=hide;
  document.getElementById('scoreChip').textContent='Skor '+total();
  document.getElementById('btnMap').hidden=(state.screen==='map'||state.screen==='guide');
  document.getElementById('btnSpeak').hidden=!synth;
}
function render(){
  var act=document.activeElement,fid=act&&act.dataset?act.dataset.fid:null;
  var sc=SCREENS[state.screen]();
  app.innerHTML=sc.html;NARR=sc.narr||'';updateHeader();
  if(sc.after)sc.after();
  if(fid){var el=app.querySelector('[data-fid="'+fid+'"]');if(el&&!el.disabled)el.focus({preventScroll:true});}
}
function go(s){
  state.screen=s;render();window.scrollTo(0,0);
  if(state.opts.voice)speak(NARR);
}
function startLevel(n){
  if(n===1)initL1();else if(n===2)initL2();else if(n===3)initL3();else if(n===4)initL4();
  go('l'+n);
}

function finish(n,items,correct,totalN,o){
  o=o||{};
  var score=o.score!==undefined?o.score:Math.round(PER*correct/totalN);
  var pass=correct/totalN>=PASS-1e-9;
  state.best[n-1]=Math.max(state.best[n-1],score);
  if(pass)state.passed[n-1]=true;
  state.fb={n:n,items:items,correct:correct,total:totalN,score:score,pass:pass,lesson:o.lesson||'',tips:o.tips||[],writing:!!o.writing};
  go('fb');
}

function sentences(t){return (t.trim().match(/[^.!?\n]+[.!?]*/g)||[]).map(function(s){return s.trim();}).filter(function(s){return /[A-Za-z]/.test(s);});}

function analyze(t){
  var ss=sentences(t),n=ss.length,low=t.toLowerCase();
  var groups=[/akar|tunjang/,/abrasi|gelombang|ombak/,/habitat|kepiting|ikan|biota/,/lumpur|pesisir|pantai|payau/,/kendawangan|kalimantan/];
  var hit=groups.filter(function(g){return g.test(low);}).length;
  var subj=['saya','aku','kami','kita','menurut saya','menurutku','indah','cantik','bagus','jelek','menyenangkan','seru','keren','sangat','sekali','paling','sebaiknya','seharusnya','menakjubkan','luar biasa'];
  var found=subj.filter(function(w){return new RegExp('(^|[^a-z])'+w+'([^a-z]|$)').test(low);});
  var first=n?ss[0].toLowerCase():'',lastS=n?ss[n-1].toLowerCase():'';
  var struct=n>=3&&/mangrove|bakau/.test(first)&&/perlu|harus|dilestarikan|dijaga|dirawat|oleh karena itu|dengan demikian|jadi|sehingga|kesimpulan|simpulan|mari|ayo/.test(lastS);
  var manfaat=/manfaat|bermanfaat|mencegah|melindungi|menahan|masyarakat|nelayan|warga|penghasilan/.test(low);
  var items=[
    {ok:hit>=2,title:'Memuat informasi faktual',detail:hit>=2?'':'Tambahkan fakta dari data pengamatan, misalnya tentang akar tunjang, abrasi, atau habitat biota laut.'},
    {ok:found.length===0&&n>0,title:'Menggunakan bahasa yang objektif',detail:found.length?'Hindari kata bernada pendapat atau perasaan: '+found.join(', ')+'.':''},
    {ok:struct,title:'Struktur teks cukup runtut',detail:struct?'':'Awali dengan pernyataan umum tentang mangrove dan akhiri dengan penutup atau simpulan.'},
    {ok:n>=3,title:'Memuat minimal 3 kalimat',detail:n>=3?'':'Tulisanmu baru '+n+' kalimat. Tulis minimal 3 kalimat.'}
  ];
  var tips=[];
  if(!manfaat)tips.push('Tambahkan informasi tentang manfaat mangrove bagi masyarakat pesisir Kendawangan.');
  if(n>5)tips.push('Ringkas tulisanmu menjadi maksimal 5 kalimat.');
  tips.push('Pengecekan otomatis hanya membaca ciri tulisan. Gurumu tetap dapat menilai isi, ejaan, dan kerapian kalimat.');
  return {items:items,tips:tips,correct:items.filter(function(i){return i.ok;}).length};
}

/* ---------- aksi ---------- */
var ACT={
  start:function(){state.guideBack='map';go('guide');},
  goals:function(){openModal('<h2 id="mt">Tujuan Game</h2><p>Setelah bermain, kamu mampu:</p><ul class="facts"><li>mengenali ciri dan objek di ekosistem mangrove;</li><li>membedakan fakta dan opini;</li><li>menyusun struktur teks laporan hasil observasi (pernyataan umum, deskripsi bagian, deskripsi manfaat, penutup);</li><li>menerapkan nilai peduli lingkungan dan gotong royong;</li><li>menulis teks LHO singkat tentang mangrove Kendawangan.</li></ul>');},
  quit:function(){openModal('<h2 id="mt">Keluar dari game?</h2><p>Skor dan progres pada sesi ini akan dihapus.</p><div class="row"><button class="btn red" type="button" data-act="quitYes">Keluar</button></div>');},
  quitYes:function(){closeModal();resetAll();go('bye');},
  toGuide:function(){state.guideBack=(state.screen==='open'||state.screen==='guide')?(state.guideBack||'map'):state.screen;if(state.screen==='open')state.guideBack='open';go('guide');},
  guideNext:function(){go(state.guideBack==='open'?'open':(state.guideBack&&state.guideBack!=='guide'?state.guideBack:'map'));},
  toMap:function(){go('map');},
  speak:function(){speak(NARR);},
  node:function(d){startLevel(+d.n);},
  toResult:function(){go('result');},
  /* L1 */
  l1img:function(d){var s=state.l1;s.sel=(s.sel===d.id)?null:d.id;render();},
  l1name:function(d){var s=state.l1;
    if(s.sel){Object.keys(s.pairs).forEach(function(k){if(s.pairs[k]===d.id)delete s.pairs[k];});s.pairs[s.sel]=d.id;s.sel=null;}
    else{var k=Object.keys(s.pairs).filter(function(k){return s.pairs[k]===d.id;})[0];if(k)s.sel=k;}
    render();},
  l1check:function(){
    var s=state.l1,c=0,items=s.img.map(function(id,i){
      var pick=s.pairs[id],ok=pick===id;if(ok)c++;
      return {ok:ok,title:'Gambar '+(i+1)+': '+L1M[id].name,detail:(ok||!pick?'':'Kamu memilih "'+L1M[pick].name+'". ')+L1M[id].fact};
    });
    finish(1,items,c,items.length,{lesson:L1M.akar.fact});},
  /* L2 */
  l2pick:function(d){var s=state.l2;if(s.shown)return;s.pick=d.v;render();},
  l2check:function(){var s=state.l2,it=L2[s.order[s.i]],ok=s.pick===it.t;s.shown=true;
    s.res.push({ok:ok,title:'“'+it.s+'”',detail:(ok?'Jawabanmu '+s.pick.toUpperCase()+'. ':'Jawabanmu '+s.pick.toUpperCase()+', seharusnya '+it.t.toUpperCase()+'. ')+it.e});
    live(ok?'Benar':'Belum tepat');render();},
  l2next:function(){var s=state.l2;
    if(s.i>=L2.length-1){var c=s.res.filter(function(r){return r.ok;}).length;finish(2,s.res,c,s.res.length,{lesson:'Fakta dapat dibuktikan. Opini memuat penilaian atau perasaan, misalnya kata indah, enak, atau menurut saya.'});}
    else{s.i++;s.pick=null;s.shown=false;render();window.scrollTo(0,0);if(state.opts.voice)speak(NARR);}},
  /* L3 */
  l3chip:function(d){var s=state.l3;s.sel=(s.sel===d.id)?null:d.id;render();},
  l3slot:function(d){var s=state.l3,k=+d.k;
    if(s.sel){s.slots[k]=s.sel;s.sel=null;}else if(s.slots[k]){s.slots[k]=null;}
    render();},
  l3check:function(){
    var s=state.l3,c=0,items=STRUCT.map(function(st,k){
      var id=s.slots[k],ok=L3M[id].slot===k;if(ok)c++;
      return {ok:ok,title:st.name,detail:(ok?'':'Kalimatmu: “'+L3M[id].t+'”. Kalimat yang tepat: “'+L3BY[k].t+'”. ')+st.tip};
    });
    finish(3,items,c,items.length,{lesson:'Teks LHO tersusun atas pernyataan umum, deskripsi bagian, deskripsi manfaat, dan penutup.'});},
  /* L4 */
  l4pick:function(d){var s=state.l4;if(s.shown)return;s.sel[d.id]=!s.sel[d.id];render();},
  l4check:function(){var s=state.l4,rd=s.order[s.r];s.shown=true;
    rd.forEach(function(o){var on=!!s.sel[o.id],ok=on===o.good;
      s.res.push({ok:ok,title:o.t,detail:(o.good?'Tindakan yang tepat. ':'Tindakan yang kurang tepat. ')+o.w+(ok?'':(on?' Kamu memilihnya.':' Kamu tidak memilihnya.'))});});
    render();},
  l4next:function(){var s=state.l4;
    if(s.r>=L4.length-1){var c=s.res.filter(function(r){return r.ok;}).length;finish(4,s.res,c,s.res.length,{lesson:'Menjaga mangrove berarti menanam, merawat, dan tidak merusaknya, serta dilakukan bersama-sama dengan semangat gotong royong.'});}
    else{s.r++;s.shown=false;render();window.scrollTo(0,0);if(state.opts.voice)speak(NARR);}},
  /* L5 */
  l5send:function(){var a=analyze(state.text);
    finish(5,a.items,a.correct,4,{score:a.correct*5,tips:a.tips,writing:true});},
  /* fb */
  fbRetry:function(){var n=state.fb.n;if(n===5)go('l5');else startLevel(n);},
  fbNext:function(){var n=state.fb.n;if(n<5)startLevel(n+1);else go('result');},
  /* akhir */
  again:function(){resetAll();go('map');},
  toReflect:function(){go('reflect');},
  finish:function(){go('bye');},
  copyRef:function(){var t=state.reflect||'',ok=document.getElementById('cpOk');
    function msg(m){if(ok)ok.textContent=m;}
    if(!t.trim()){msg('Tulis refleksi dulu.');return;}
    try{navigator.clipboard.writeText(t).then(function(){msg('Tersalin.');},function(){sel();});}catch(e){sel();}
    function sel(){var x=document.getElementById('rf');if(x){x.focus();x.select();}msg('Teks dipilih. Salin dengan Ctrl+C atau tekan lama.');}},
  cert:function(){openModal('<h2 id="mt">Sertifikat Penjaga Mangrove</h2><label for="certName"><b>Nama lengkap</b></label><input type="text" id="certName" autocomplete="name" placeholder="Tulis namamu"><div class="row"><button class="btn green" type="button" data-act="certMake">Buat Sertifikat</button></div><div id="certOut"></div>');},
  certMake:async function(){
    var nm=(document.getElementById('certName').value||'').trim(),out=document.getElementById('certOut');
    if(!nm){out.innerHTML='<p class="hint">Isi nama lebih dulu.</p>';return;}
    out.innerHTML='<p class="hint">Membuat sertifikat ...</p>';
    var url=await drawCert(nm);
    out.innerHTML='<img class="cert" alt="Sertifikat Penjaga Mangrove atas nama '+esc(nm)+'" src="'+url+'"><p class="note">Unduhan langsung tidak tersedia di halaman ini. Tekan lama gambar (HP) atau klik kanan (komputer) untuk menyimpan, atau ambil tangkapan layar.</p>';
  }
};

function resetAll(){state.best=[0,0,0,0,0];state.passed=[false,false,false,false,false];state.text='';state.reflect='';state.fb=null;}

async function drawCert(name){
  try{await document.fonts.load('800 80px "Baloo 2"');await document.fonts.load('700 30px "Atkinson Hyperlegible"');}catch(e){}
  var c=document.createElement('canvas');c.width=1400;c.height=990;var x=c.getContext('2d');
  x.fillStyle='#f8fcf5';x.fillRect(0,0,1400,990);
  x.strokeStyle='#8a5726';x.lineWidth=18;x.strokeRect(24,24,1352,942);
  x.strokeStyle='#2d7a43';x.lineWidth=4;x.strokeRect(56,56,1288,878);
  var cols=['#256f3f','#2e8b4f','#3fa35c'];
  for(var i=0;i<16;i++){x.fillStyle=cols[i%3];x.beginPath();x.arc(i*92+20,966,58+(i%2)*10,Math.PI,0);x.fill();}
  x.textAlign='center';x.fillStyle='#1c5a30';
  x.font='800 92px "Baloo 2", sans-serif';x.fillText('SERTIFIKAT',700,200);
  x.fillStyle='#8a5726';x.font='800 40px "Baloo 2", sans-serif';x.fillText('Penjaga Mangrove Kendawangan',700,254);
  x.fillStyle='#3d5a48';x.font='700 30px "Atkinson Hyperlegible", sans-serif';x.fillText('diberikan kepada',700,340);
  var size=88;x.fillStyle='#14301f';
  do{x.font='800 '+size+'px "Baloo 2", sans-serif';size-=4;}while(x.measureText(name).width>1100&&size>32);
  x.fillText(name,700,440);
  x.strokeStyle='#cf9a55';x.lineWidth=3;x.beginPath();x.moveTo(250,470);x.lineTo(1150,470);x.stroke();
  x.fillStyle='#14301f';x.font='700 32px "Atkinson Hyperlegible", sans-serif';
  x.fillText('telah menyelesaikan petualangan Jelajah Mangrove Digital',700,540);
  x.fillText('Teks Laporan Hasil Observasi · Bahasa Indonesia Kelas X',700,588);
  x.fillStyle='#1c5a30';x.font='800 64px "Baloo 2", sans-serif';x.fillText('Skor akhir '+total()+' / 100',700,690);
  x.fillStyle='#3d5a48';x.font='700 28px "Atkinson Hyperlegible", sans-serif';
  x.fillText('SMA Negeri 1 Kendawangan · '+new Date().toLocaleDateString('id-ID',{day:'numeric',month:'long',year:'numeric'}),700,760);
  return c.toDataURL('image/png');
}

/* modal */
var lastFocus=null;
function openModal(html){
  closeModal();lastFocus=document.activeElement;
  var m=document.createElement('div');m.className='modal';
  m.innerHTML='<div class="modal-box" role="dialog" aria-modal="true" aria-labelledby="mt">'+html+'<div class="row end"><button class="btn ghost" type="button" data-close>Tutup</button></div></div>';
  document.body.appendChild(m);
  m.addEventListener('click',function(e){if(e.target===m||e.target.closest('[data-close]'))closeModal();});
  var f=m.querySelector('input,button');if(f)f.focus();
}
function closeModal(){var m=document.querySelector('.modal');if(m){m.remove();if(lastFocus&&lastFocus.focus&&document.contains(lastFocus))lastFocus.focus();}}
document.addEventListener('keydown',function(e){if(e.key==='Escape')closeModal();});

/* delegasi */
document.addEventListener('click',function(e){
  var b=e.target.closest('[data-act]');if(!b||b.disabled)return;
  var f=ACT[b.dataset.act];if(f)f(b.dataset,b);
});
document.addEventListener('change',function(e){
  var t=e.target;if(!t.dataset||!t.dataset.opt)return;
  var k=t.dataset.opt;state.opts[k]=t.checked;
  var cl=document.documentElement.classList;
  if(k==='big')cl.toggle('big',t.checked);
  if(k==='hc')cl.toggle('hc',t.checked);
  if(k==='dys')cl.toggle('dys',t.checked);
  if(k==='voice'){if(t.checked)speak('Narasi suara aktif.');else if(synth)try{synth.cancel();}catch(x){}}
});

if(mq.addEventListener)mq.addEventListener('change',onMq);else if(mq.addListener)mq.addListener(onMq);

document.getElementById('band').innerHTML=bandSVG();
render();
